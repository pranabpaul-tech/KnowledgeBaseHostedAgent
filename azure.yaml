# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: knowledge-base-hosted-agent
metadata:
    template: azd-init@1.25.5
services:
    3iqproject426n:
        host: azure.ai.project
        endpoint: https://aiservices426n.services.ai.azure.com/api/projects/3iqproject426n
    agent-framework-agent-knowledge-base-responses:
        project: .
        host: azure.ai.agent
        language: docker
        uses:
            - 3iqproject426n
        env:
            AZURE_AI_MODEL_DEPLOYMENT_NAME: gpt-4.1
            AZURE_SEARCH_ENDPOINT: "https://aiservices426nsearch.search.windows.net"
            AZURE_SEARCH_KNOWLEDGE_BASE_NAME: "knowledgebase-1783457487321"
        container:
            resources:
                cpu: "0.5"
                memory: 1Gi
        description: |
            An Agent Framework agent grounded in a Foundry IQ Knowledge Base backed by Azure AI Search. Uses AzureAISearchContextProvider in agentic mode to run multi-hop retrieval over the knowledge base before each model invocation.
        kind: hosted
        metadata:
            tags:
                - Agent Framework
                - AI Agent Hosting
                - Azure AI AgentServer
                - Responses Protocol
                - RAG
                - Azure AI Search
                - Foundry IQ
        name: agent-framework-agent-knowledge-base-responses
        protocols:
            - protocol: responses
              version: 2.0.0
        startupCommand: python main.py
infra:
    provider: microsoft.foundry
